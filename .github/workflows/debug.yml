name: Debug crawler

on:
  pull_request:
  workflow_dispatch:

jobs:
  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run crawler
        run: python crawler.py
      - name: Show CSV
        if: always()
        run: |
          if [ -f jobs_found.csv ]; then
            cat jobs_found.csv
          else
            echo "jobs_found.csv was not created"
            exit 1
          fi
