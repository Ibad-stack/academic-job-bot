name: Academic Job Bot CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run live crawler
        run: python crawler.py
      - name: Show CSV
        if: always()
        run: |
          if [ -f jobs_found.csv ]; then
            cat jobs_found.csv
          else
            echo "jobs_found.csv was not created"
            exit 1
          fi
